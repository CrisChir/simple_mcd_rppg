services:
  clinical-vitals-app:
    build:
      context: .
      dockerfile: Dockerfile
      # Without the image: tag, compose builds its own image
      # (sliding_window_model-clinical-vitals-app) and ignores the one built
      # via 'docker build -t clinical-vitals-app .'
    image: clinical-vitals-app:latest
    # Match the tutorial's --platform linux/amd64 builds (Apple Silicon)
    platform: linux/amd64
    container_name: clinical-vitals-app
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      # Mount model files (for development)
      - ./models:/app/sliding_window_model/models:ro
      # face_landmarker.task is NOT mounted: if it were and the file did not
      # exist on the host, Docker would create a directory with that name and
      # the read-only mount would break the automatic download in entrypoint.sh.
      # The entrypoint downloads it into the container on first start (~10 MB).
      # To persist it across container recreations, download it to the host and
      # mount it explicitly:
      #   - ./face_landmarker.task:/app/face_landmarker.task:ro
      # Mount data directory for persistent storage
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - GRADIO_SHARE=False
      - MODEL_DIR=/app/sliding_window_model/models
      - FACE_MODEL_PATH=/app/face_landmarker.task
      - MAX_FRAMES=450
      - CUDA_DEVICE=0
    # GPU support: uncomment on Linux/Windows hosts with the NVIDIA
    # Container Toolkit. On macOS and CPU-only hosts the app runs on CPU
    # automatically (torch.cuda.is_available() is False, CUDA_DEVICE ignored).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    
