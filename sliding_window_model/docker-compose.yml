version: '3.8'

services:
  clinical-vitals-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical-vitals-app
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      # Mount model files (for development)
      - ./models:/app/sliding_window_model/models:ro
      - ./face_landmarker.task:/app/face_landmarker.task:ro
      # Mount data directory for persistent storage
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - GRADIO_SHARE=False
      - MODEL_DIR=/app/sliding_window_model/models
      - FACE_MODEL_PATH=/app/face_landmarker.task
      - MAX_FRAMES=450
      - CUDA_DEVICE=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
